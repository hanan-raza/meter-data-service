services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mds
      POSTGRES_PASSWORD: mds_dev
      POSTGRES_DB: meter_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mds -d meter_data"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
